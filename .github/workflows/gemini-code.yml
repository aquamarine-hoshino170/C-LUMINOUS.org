name: Gemini 3.1 Pro Code Engine

on:
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: [main]

jobs:
  autonomous-code-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Gemini 3.1 Pro Deep Audit & Optimization
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c '
          import os
          import sys
          import glob
          import json
          import urllib.request

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              print("GEMINI_API_KEY Missing! Check repository secrets.")
              sys.exit(0)

          # প্রাথমিক মডেল: Gemini 3.1 Pro (উন্নত রিজনিং)
          models_to_try = [
              "gemini-3.1-pro",
              "gemini-1.5-pro"
          ]

          rust_files = glob.glob("src/**/*.rs", recursive=True)
          if not rust_files:
              print("src ফোল্ডারে কোনো Rust ফাইল পাওয়া যায়নি।")
              sys.exit(0)

          system_prompt = """
          You are Gemini Code (Autonomous Engine) powered by Gemini 3.1 Pro.
          Target Stack: High-performance register-based VM, ARM NEON SIMD runtime in Rust.
          Task:
          1. Perform deep static analysis on memory safety, SIMD vectorization, register bounds, and zero-cost abstractions.
          2. Detect weak, inefficient, or redundant patterns.
          3. Rewrite weak functions into hardened, zero-copy, cache-friendly, and SIMD-optimized production Rust code.
          4. Output strictly in JSON format as a list of file changes:
          [
            {"path": "src/path/to/file.rs", "content": "NEW_COMPLETE_FILE_CONTENT"}
          ]
          Do NOT wrap JSON in markdown backticks. Output pure JSON only.
          """

          files_payload = {}
          for f_path in rust_files[:5]:
              try:
                  with open(f_path, "r", encoding="utf-8", errors="ignore") as f:
                      files_payload[f_path] = f.read()
              except Exception as err:
                  print(f"Error reading {f_path}: {err}")

          if not files_payload:
              print("ফাইল রিড করা যায়নি।")
              sys.exit(0)

          request_body = {
              "contents": [{
                  "parts": [
                      {"text": system_prompt},
                      {"text": f"CURRENT_CODEBASE:\n{json.dumps(files_payload)}"}
                  ]
              }],
              "generationConfig": {
                  "temperature": 0.1
              }
          }

          success = False
          for model_name in models_to_try:
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model_name}:generateContent?key={api_key}"
              req = urllib.request.Request(
                  url,
                  data=json.dumps(request_body).encode("utf-8"),
                  headers={"Content-Type": "application/json"}
              )
              try:
                  print(f"Connecting to model: {model_name}...")
                  with urllib.request.urlopen(req) as resp:
                      res = json.loads(resp.read().decode("utf-8"))
                      raw_output = res["candidates"][0]["content"]["parts"][0]["text"].strip()
                      
                      # মার্কডাউন বা ব্যাকটিক থাকলে ক্লিন করা
                      if raw_output.startswith("```"):
                          raw_output = raw_output.split("\n", 1)[1].rsplit("\n", 1)[0]

                      file_updates = json.loads(raw_output)
                      for update in file_updates:
                          target_path = update.get("path")
                          new_content = update.get("content")
                          if target_path and new_content:
                              os.makedirs(os.path.dirname(target_path), exist_ok=True)
                              with open(target_path, "w", encoding="utf-8") as out:
                                  out.write(new_content)
                              print(f"[Engine Updated]: {target_path}")
                      success = True
                      break
              except Exception as e:
                  print(f"Notice with {model_name}: {e}")

          if not success:
              print("Audit step completed without file overrides.")
          '

      - name: Verify Code Status
        run: |
          git status
