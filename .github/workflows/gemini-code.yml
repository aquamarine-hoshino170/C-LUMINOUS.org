name: Ultimate Gemini Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Agent-এর কাজ"
        required: true
      model:
        description: "Gemini model"
        default: "gemini-3.1-pro-preview"
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || (github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '/agent '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model || 'gemini-3.1-pro-preview' }}
          TASK: ${{ inputs.task || github.event.comment.body }}
        run: python .github/agent/agent.py
      - name: Open PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "no changes"; exit 0; fi
          B="agent/run-${{ github.run_id }}"
          git config user.name "gemini-agent"
          git config user.email "gemini-agent@users.noreply.github.com"
          git checkout -b "$B"
          git add -A
          git commit -m "agent: automated changes (run ${{ github.run_id }})"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$B"
          gh pr create --base main --head "$B" --title "Gemini agent: run ${{ github.run_id }}" --body-file /tmp/agent_summary.md || echo "PR তৈরি হয়নি, Settings চেক করুন"
