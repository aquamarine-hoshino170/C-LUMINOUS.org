name: Luminous Cloud Native Gemini 3.1 Pro Agent

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  luminous-cloud-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI Library
        run: |
          pip install --upgrade pip
          pip install google-genai

      - name: Run Gemini 3.1 Pro Systems Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - << 'PYEOF'
          import os
          import sys
          import glob
          import json

          gemini_key = os.environ.get("GEMINI_API_KEY")
          if not gemini_key:
              print("[Cloud Agent] GEMINI_API_KEY secret not found; skipping API pass safely.")
              sys.exit(0)

          try:
              from google import genai
              ai_client = genai.Client(api_key=gemini_key)
          except Exception as e:
              print(f"[Cloud Agent Setup Notice]: {e}")
              sys.exit(0)

          # সোর্স কোড সংগ্রহ
          files_to_read = glob.glob("src/**/*.rs", recursive=True) + glob.glob("*.lum")
          context_map = {}
          for f_path in files_to_read[:8]:
              try:
                  with open(f_path, "r", encoding="utf-8", errors="ignore") as f:
                      context_map[f_path] = f.read()
              except Exception:
                  pass

          if not context_map:
              print("[Cloud Agent] No target source files found.")
              sys.exit(0)

          system_prompt = """
          You are Principal Systems Architect for Luminous Programming Language (SVM, ARM SIMD, Chloe Protocol).
          Review the codebase, optimize register allocation, memory layout, and compiler robustness.
          Output strictly in plain JSON format:
          [
            {"path": "src/path/to/file.rs", "content": "NEW_REFACTORED_CONTENT"}
          ]
          No backticks, plain JSON only.
          """

          prompt = f"{system_prompt}\n\nCURRENT SOURCE FILES:\n{json.dumps(context_map)}"
          models = ["gemini-3.1-pro", "gemini-2.5-pro", "gemini-2.5-flash"]

          for model_id in models:
              try:
                  print(f"[Cloud Agent] Executing deep audit with {model_id}...")
                  response = ai_client.models.generate_content(
                      model=model_id,
                      contents=prompt
                  )
                  raw = response.text.strip()
                  if raw.startswith("```"):
                      raw = raw.split("\n", 1)[1].rsplit("\n", 1)[0]
                  updates = json.loads(raw)
                  for item in updates:
                      p = item.get("path")
                      c = item.get("content")
                      if p and c:
                          os.makedirs(os.path.dirname(p), exist_ok=True)
                          with open(p, "w", encoding="utf-8") as out:
                              out.write(c)
                          print(f"[Audit Patched]: {p}")
                  print("[Cloud Agent] Audit and patch pass completed successfully.")
                  break
              except Exception as err:
                  print(f"[Notice] Model {model_id} step note: {err}")
          PYEOF

      - name: Commit and Push Hardened Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git checkout -b gemini-3-1-pro-audit || git checkout gemini-3-1-pro-audit
            git add -A
            git commit -m "feat(audit): hardened VM logic via Gemini 3.1 Pro"
            git push origin gemini-3-1-pro-audit --force
            echo "Successfully pushed refactored code to branch: gemini-3-1-pro-audit"
          else
            echo "Clean audit: No immediate modifications required."
          fi
